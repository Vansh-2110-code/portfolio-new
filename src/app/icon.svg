<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="vgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Code brackets and VG Monogram -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <text x="75" y="250" font-size="190" fill="#6366f1" font-weight="400" opacity="0.8">{</text>
    <text x="256" y="256" font-size="160" fill="url(#vgGrad)" letter-spacing="4">VG</text>
    <text x="437" y="250" font-size="190" fill="#6366f1" font-weight="400" opacity="0.8">}</text>
  </g>
</svg>
